<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gyroid Lattice</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 深邃的背景色 */
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* 左上角文本信息 */
        #info-panel {
            position: absolute;
            top: 30px;
            left: 40px;
            pointer-events: none;
            max-width: 300px;
        }
        .subtitle {
            font-size: 10px;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .title {
            font-size: 22px;
            color: #fff;
            font-weight: 600;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }
        .description {
            font-size: 12px;
            line-height: 1.5;
            color: #999;
        }

        /* 底部控制按钮 */
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 10px 20px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        button:hover {
            border-color: rgba(255, 200, 100, 0.8);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 200, 100, 0.2);
        }
        button.active {
            border-color: #e0b85c;
            color: #e0b85c;
        }
    </style>
    
    <!-- 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <div class="subtitle">A Convergent Web Matrix</div>
        <h1 class="title">Quantum Gyroid Lattice</h1>
        <div class="description">
            An intricate 3D gyroidal connection network transferring multi-layered quantum data state flows through non-euclidean space topology.
        </div>
    </div>

    <div id="controls">
        <button id="btn-next">Next Shape</button>
        <button id="btn-spin" class="active">Auto Spin: ON</button>
        <button id="btn-reset">Reset View</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. 基础场景设置 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. 创建发光粒子材质 ---
        // 使用 Canvas 生成一个径向渐变的圆形作为粒子纹理，使其看起来像发光球体
        const createGlowTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 215, 100, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        };

        const themeColor = new THREE.Color(0xe0b85c); // 金黄色

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.8,
            map: createGlowTexture(),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending, // 叠加混合，产生发光效果
            depthWrite: false,
            color: themeColor
        });

        const lineMaterial = new THREE.LineBasicMaterial({
            color: themeColor,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        // --- 3. 生成 Gyroid 结构数据 ---
        let mainGroup = new THREE.Group();
        scene.add(mainGroup);

        function generateGyroid() {
            const positions = [];
            const boundingSize = 15;
            const particleCountTarget = 1500;
            
            // 随机采样生成 Gyroid (极小曲面)
            // 公式: sin(x)cos(y) + sin(y)cos(z) + sin(z)cos(x) = 0
            for (let i = 0; i < 50000; i++) {
                let x = (Math.random() - 0.5) * boundingSize * 2;
                let y = (Math.random() - 0.5) * boundingSize * 2;
                let z = (Math.random() - 0.5) * boundingSize * 2;

                let scale = 0.5; // 控制晶格的密度
                let val = Math.sin(x * scale) * Math.cos(y * scale) + 
                          Math.sin(y * scale) * Math.cos(z * scale) + 
                          Math.sin(z * scale) * Math.cos(x * scale);

                // 如果点靠近该曲面方程的解(绝对值接近0)，则保留该点
                if (Math.abs(val) < 0.15) {
                    // 限制在一个正方体范围内
                    if (Math.abs(x) < boundingSize && Math.abs(y) < boundingSize && Math.abs(z) < boundingSize) {
                        positions.push(new THREE.Vector3(x, y, z));
                        if (positions.length >= particleCountTarget) break;
                    }
                }
            }

            // 创建粒子系统
            const geometry = new THREE.BufferGeometry().setFromPoints(positions);
            const particles = new THREE.Points(geometry, particleMaterial);
            mainGroup.add(particles);

            // 创建粒子之间的连线
            const linePositions = [];
            const connectDistance = 2.2; // 连线阈值距离

            for (let i = 0; i < positions.length; i++) {
                for (let j = i + 1; j < positions.length; j++) {
                    const dist = positions[i].distanceTo(positions[j]);
                    if (dist < connectDistance) {
                        linePositions.push(
                            positions[i].x, positions[i].y, positions[i].z,
                            positions[j].x, positions[j].y, positions[j].z
                        );
                    }
                }
            }

            const lineGeometry = new THREE.BufferGeometry();
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            mainGroup.add(lines);
        }

        generateGyroid();

        // --- 4. UI 交互逻辑 ---
        let autoSpin = true;
        
        const btnSpin = document.getElementById('btn-spin');
        const btnReset = document.getElementById('btn-reset');
        const btnNext = document.getElementById('btn-next');

        btnSpin.addEventListener('click', () => {
            autoSpin = !autoSpin;
            if (autoSpin) {
                btnSpin.textContent = 'Auto Spin: ON';
                btnSpin.classList.add('active');
            } else {
                btnSpin.textContent = 'Auto Spin: OFF';
                btnSpin.classList.remove('active');
            }
        });

        btnReset.addEventListener('click', () => {
            // 平滑过渡重置视角逻辑可以更复杂，这里用简单的重置
            camera.position.set(0, 0, 35);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            mainGroup.rotation.set(0, 0, 0);
        });

        btnNext.addEventListener('click', () => {
            // 清除旧模型
            while(mainGroup.children.length > 0){ 
                let child = mainGroup.children[0];
                mainGroup.remove(child); 
                child.geometry.dispose();
            }
            // 重新生成（每次随机种子不同，虽然形状遵循 Gyroid 公式，但细节会有差异）
            generateGyroid();
            mainGroup.rotation.set(0, 0, 0);
        });

        // --- 5. 动画循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (autoSpin) {
                // 缓慢旋转模型
                mainGroup.rotation.y += 0.15 * delta;
                mainGroup.rotation.x += 0.05 * delta;
            }

            // 让整个模型有轻微的呼吸感
            const time = clock.getElapsedTime();
            mainGroup.scale.setScalar(1 + Math.sin(time * 0.5) * 0.02);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 6. 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
